name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test -c Release

      - name: Publish binaries
        run: |
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            dotnet publish src/SchemaScope -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -o "publish/$rid"
          done

      - name: Package archives
        run: |
          mkdir dist
          version="${GITHUB_REF_NAME#v}"
          cd publish
          zip -j "../dist/schemascope-${version}-win-x64.zip" win-x64/schemascope.exe
          for rid in linux-x64 osx-x64 osx-arm64; do
            tar -czf "../dist/schemascope-${version}-${rid}.tar.gz" -C "$rid" schemascope
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
